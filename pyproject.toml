[tool.poetry]
name = "tg-channel-aggregator"
version = "0.3.1"
description = "aggregate channels"
authors = ["Dmitriy Zharikhin <dzharikhin>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
telethon = "^1.44.0"
qrcode = "^8.2"
persist-queue = "^1.1.0"
pillow = "^12.2.0"
pycryptodome = "^3.23.0"
python-statemachine = "^3.2.1"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
ruff = ">=0.11,<1"
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
# black owns line length; it cannot split long string literals
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
build-backend = "poetry.core.masonry.api"
